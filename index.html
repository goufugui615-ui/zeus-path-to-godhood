<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宙斯成神之路 · Zeus: Path to Godhood</title>
<style>
  :root{
    --ink:#2b2b33; --paper:#f4ecd8; --paper2:#efe3c5;
    --gold:#b8860b; --red:#a63a2b; --blue:#2f5d8a; --green:#4a6b3a;
    --zeus-accent:#d4a017;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#1c1a22;}
  body{
    font-family:"KaiTi","STKaiti","楷体","FZKai-Z03S",cursive,serif;
    color:var(--ink); user-select:none;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #viewport{position:relative;width:960px;height:600px;transform-origin:center center;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas#game{position:absolute;inset:0;width:100%;height:100%;background:var(--paper);cursor:crosshair;}

  /* ---------- 手绘风通用 ---------- */
  .sketch{
    background:var(--paper);
    border:2.5px solid var(--ink);
    border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
    box-shadow:3px 4px 0 rgba(43,43,51,.25);
  }
  .sketch-btn{
    font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;
    background:var(--paper);padding:4px 14px;
    border:2px solid var(--ink);
    border-radius:225px 12px 255px 12px/12px 255px 12px 225px;
    box-shadow:2px 2px 0 rgba(43,43,51,.3);
    transition:transform .08s;
  }
  .sketch-btn:hover{transform:translate(-1px,-1px) rotate(-.5deg);background:#fff9ea;}
  .sketch-btn:active{transform:translate(1px,1px);box-shadow:none;}
  .sketch-btn.gold{background:var(--zeus-accent);color:#fff;border-color:#7a5a00;}
  .sketch-btn.danger{background:var(--red);color:#fff;border-color:#5e1c12;}
  .sketch-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

  /* ---------- 顶栏 HUD ---------- */
  #hud{position:absolute;top:8px;left:10px;right:10px;display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:30;}
  #hud>*{pointer-events:auto;}
  #power-panel{padding:6px 18px;min-width:230px;}
  #power-panel .label{font-size:13px;color:#7a6a45;letter-spacing:2px;}
  #power-value{font-size:30px;font-weight:bold;color:var(--gold);line-height:1.05;text-shadow:1px 1px 0 rgba(184,134,11,.25);}
  #power-rate{font-size:13px;color:var(--green);}
  #hera-panel{padding:6px 14px;min-width:210px;flex:1;max-width:290px;}
  #hera-panel .label{font-size:13px;color:#7a6a45;letter-spacing:2px;display:flex;justify-content:space-between;}
  #hera-bar-wrap{height:14px;border:2px solid var(--ink);border-radius:8px 3px 9px 4px;background:#efe3c5;overflow:hidden;margin-top:2px;}
  #hera-bar{height:100%;width:0%;background:linear-gradient(90deg,#c76b5a,var(--red));transition:width .5s;}
  #hera-hint{font-size:11px;color:#9a5a4a;margin-top:2px;height:13px;}
  #hud-buttons{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:330px;}
  #zone-label{position:absolute;bottom:10px;left:12px;font-size:15px;padding:3px 16px;z-index:20;pointer-events:none;opacity:.92;}
  #interact-tip{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);padding:5px 20px;font-size:16px;z-index:20;pointer-events:none;display:none;}

  /* ---------- 弹窗 ---------- */
  .modal-mask{position:absolute;inset:0;background:rgba(28,26,34,.45);z-index:50;display:flex;align-items:center;justify-content:center;}
  .modal{width:640px;max-width:94%;max-height:86%;padding:20px 26px;display:flex;flex-direction:column;transform:rotate(-.4deg);}
  .modal h2{font-size:24px;border-bottom:2.5px dashed var(--ink);padding-bottom:8px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .modal h2 .close-x{cursor:pointer;font-size:20px;padding:0 8px;border:2px solid var(--ink);border-radius:50% 40% 55% 45%;background:#f8e8c8;}
  .modal .body{overflow-y:auto;padding-right:6px;}
  .modal .body::-webkit-scrollbar{width:8px;}
  .modal .body::-webkit-scrollbar-thumb{background:#c9b98d;border-radius:4px;}

  .row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap;}
  .divider{border:none;border-top:2px dashed rgba(43,43,51,.35);margin:10px 0;}

  /* 求爱面板 */
  .mother-card{display:flex;gap:14px;align-items:center;background:#faf3df;border:2px solid var(--ink);border-radius:15px 120px 15px 110px/110px 15px 120px 15px;padding:10px 16px;}
  .mother-card canvas{background:#fff9ea;border:1.5px solid rgba(43,43,51,.4);border-radius:50% 45% 55% 48%;flex:none;}
  .q-stars{color:var(--gold);letter-spacing:2px;font-size:16px;}
  input[type=range]{-webkit-appearance:none;width:100%;height:26px;background:transparent;cursor:pointer;}
  input[type=range]::-webkit-slider-runnable-track{height:8px;background:#d8c9a3;border:2px solid var(--ink);border-radius:6px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;background:var(--zeus-accent);border:2.5px solid var(--ink);border-radius:45% 55% 50% 50%;box-shadow:1px 1px 0 rgba(0,0,0,.3);}

  /* 子嗣表 */
  table.roster{width:100%;border-collapse:collapse;font-size:14px;}
  table.roster th{border-bottom:2px solid var(--ink);text-align:left;padding:4px 6px;color:#7a6a45;}
  table.roster td{border-bottom:1.5px dashed rgba(43,43,51,.3);padding:4px 6px;}
  .tag{display:inline-block;font-size:12px;padding:0 8px;border:1.5px solid;border-radius:30% 60% 40% 60%;margin-right:4px;}
  .tag.cow{color:#8a5a2b;border-color:#8a5a2b;background:#f5e6cc;}
  .tag.curse{color:var(--red);border-color:var(--red);background:#f9e3dc;}
  .tag.hero{color:var(--blue);border-color:var(--blue);background:#e3edf7;}
  .tag.legend{color:#7a5a00;border-color:#b8860b;background:#fdf3d0;}

  /* 升级卡片 */
  .upg-card{border:2px solid var(--ink);border-radius:14px 120px 14px 100px/100px 14px 120px 14px;padding:10px 14px;margin:8px 0;background:#faf3df;display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .upg-card.maxed{opacity:.6;background:#eee6d2;}

  /* 事件横幅 */
  #event-banner{position:absolute;top:110px;left:50%;transform:translateX(-50%) rotate(-.6deg);max-width:70%;padding:10px 26px;font-size:17px;z-index:40;text-align:center;display:none;}
  #event-banner.good{border-color:var(--green);background:#eef3e2;}
  #event-banner.bad{border-color:var(--red);background:#f9e3dc;}
  #event-banner .sub{font-size:13px;color:#7a6a45;margin-top:2px;}

  /* 通知 */
  #toasts{position:absolute;right:12px;bottom:64px;display:flex;flex-direction:column;gap:6px;z-index:45;pointer-events:none;align-items:flex-end;}
  .toast{padding:5px 14px;font-size:14px;animation:toastin .25s ease-out, toastout .4s ease-in 3.4s forwards;max-width:360px;}
  @keyframes toastin{from{opacity:0;transform:translateX(30px) rotate(2deg);}to{opacity:1;}}
  @keyframes toastout{to{opacity:0;transform:translateY(-12px);}}

  /* 日志 */
  #log-list{font-size:13.5px;line-height:1.7;max-height:400px;overflow-y:auto;}
  #log-list .t{color:#a0946e;margin-right:6px;font-size:12px;}
  #log-list .good{color:var(--green);} #log-list .bad{color:var(--red);}

  /* ---------- 繁殖动画 ---------- */
  #breed-overlay{position:absolute;inset:0;background:rgba(28,26,34,0);z-index:60;display:none;align-items:center;justify-content:center;transition:background .5s;}
  #breed-overlay.on{background:rgba(28,26,34,.88);}
  #breed-stage{position:relative;width:560px;height:420px;}
  .breed-fig{position:absolute;bottom:60px;transition:transform 1.1s ease-in-out;}
  #breed-fig-l{left:60px;} #breed-fig-r{right:60px;}
  #breed-overlay.flirting #breed-fig-l{transform:translateX(120px);}
  #breed-overlay.flirting #breed-fig-r{transform:translateX(-120px);}
  #breed-cloud{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);width:260px;height:170px;transition:transform .8s;opacity:0;}
  #breed-overlay.cloud #breed-cloud{transform:translate(-50%,-50%) scale(1);opacity:1;}
  #breed-text{position:absolute;bottom:8px;width:100%;text-align:center;color:#f4ecd8;font-size:20px;letter-spacing:3px;text-shadow:0 0 12px rgba(212,160,23,.8);}
  #breed-bolt{position:absolute;left:50%;top:6%;transform:translateX(-50%);opacity:0;font-size:0;color:#ffd94a;}
  #breed-overlay.zap #breed-bolt{animation:zap .5s ease-out forwards;}
  @keyframes zap{0%{opacity:0;font-size:0;}30%{opacity:1;font-size:120px;}80%{opacity:1;font-size:110px;}100%{opacity:0;font-size:120px;}}
  .heart{position:absolute;color:#e05a6d;font-size:24px;animation:heartup 1.6s ease-out forwards;opacity:0;}
  @keyframes heartup{0%{opacity:0;transform:translateY(0) scale(.4);}20%{opacity:1;}100%{opacity:0;transform:translateY(-130px) scale(1.3) rotate(18deg);}}

  /* ---------- 赫拉降临 ---------- */
  #hera-overlay{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;}
  #hera-overlay.on{display:flex;}
  #hera-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(120,20,20,0) 40%, rgba(120,20,20,.55) 100%);animation:vign .6s;}
  @keyframes vign{from{opacity:0;}to{opacity:1;}}
  #hera-dialog{position:relative;width:560px;padding:22px 28px;transform:rotate(.5deg);background:#f9e9e0;border-color:var(--red);}
  #hera-dialog h2{color:var(--red);}
  #hera-dialog .hera-quote{font-size:16px;line-height:1.8;margin:10px 0;font-style:italic;}
  .choice-btn{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 16px;font-size:15px;}
  .choice-btn small{display:block;color:#7a6a45;font-size:12.5px;margin-top:2px;}

  /* ---------- 主菜单 ---------- */
  #menu{position:absolute;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:var(--paper);}
  #menu.hide{display:none;}
  #menu-inner{text-align:center;padding:40px 70px;transform:rotate(-.6deg);}
  #menu h1{font-size:52px;letter-spacing:8px;color:var(--gold);text-shadow:2px 2px 0 rgba(184,134,11,.3);}
  #menu .en{font-size:14px;letter-spacing:5px;color:#a0946e;margin:4px 0 14px;}
  #menu .desc{font-size:15px;color:#5a4f38;line-height:1.9;max-width:460px;margin:0 auto 20px;}
  #menu .btns{display:flex;flex-direction:column;gap:10px;align-items:center;}
  #menu .btns .sketch-btn{font-size:19px;padding:8px 46px;}
  #menu canvas{margin-top:14px;}
  #menu .footer{margin-top:16px;font-size:12px;color:#a0946e;}

  /* ---------- 登神结局 ---------- */
  #win-overlay{position:absolute;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:rgba(28,26,34,.92);}
  #win-overlay.on{display:flex;}
  #win-inner{text-align:center;padding:36px 60px;color:var(--ink);}
  #win-inner h1{font-size:44px;color:var(--gold);letter-spacing:6px;margin-bottom:6px;}
  #win-stats{font-size:15px;line-height:2;margin:14px 0;text-align:left;display:inline-block;}
  #win-stats b{color:var(--red);}

  /* 帮助 */
  .help-sec{margin:10px 0;}
  .help-sec h3{font-size:17px;color:var(--blue);margin-bottom:4px;}
  .help-sec p,.help-sec li{font-size:14px;line-height:1.8;}
  kbd{font-family:inherit;border:1.5px solid var(--ink);border-radius:4px 8px 5px 7px;padding:0 6px;background:#fff9ea;font-size:13px;}

  #selftest{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:200;width:640px;max-height:90%;overflow:auto;padding:16px 24px;font-size:14px;display:none;background:#fff;}
  #selftest pre{white-space:pre-wrap;line-height:1.6;}
  #vignette-event{position:absolute;inset:0;pointer-events:none;z-index:35;opacity:0;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(160,60,30,.5) 100%);transition:opacity .4s;}
</style>
</head>
<body>
<div id="stage">
  <div id="viewport">
    <canvas id="game" width="960" height="600"></canvas>
    <div id="vignette-event"></div>
    <div id="hud">
      <div id="power-panel" class="sketch">
        <div class="label">神 力</div>
        <div id="power-value">100</div>
        <div id="power-rate">+0.00 /秒</div>
      </div>
      <div id="hera-panel" class="sketch">
        <div class="label"><span>赫拉的怒气</span><span id="hera-count"></span></div>
        <div id="hera-bar-wrap"><div id="hera-bar"></div></div>
        <div id="hera-hint"></div>
      </div>
      <div id="hud-buttons">
        <button class="sketch-btn" id="btn-roster">子嗣名录</button>
        <button class="sketch-btn" id="btn-temple">奥林匹斯神殿</button>
        <button class="sketch-btn" id="btn-map">神界地图 <kbd>Q</kbd></button>
        <button class="sketch-btn" id="btn-log">日志</button>
        <button class="sketch-btn" id="btn-help">帮助 <kbd>H</kbd></button>
        <button class="sketch-btn" id="btn-sound">♪ 开</button>
        <button class="sketch-btn" id="btn-save">存档</button>
      </div>
    </div>
    <div id="zone-label" class="sketch">人类村庄</div>
    <div id="interact-tip" class="sketch">按 <kbd>E</kbd> 向 农家姑娘 求爱</div>
    <div id="event-banner" class="sketch"><div id="event-banner-main"></div><div class="sub" id="event-banner-sub"></div></div>
    <div id="toasts"></div>

    <div id="breed-overlay">
      <div id="breed-stage">
        <div class="breed-fig" id="breed-fig-l"><canvas width="130" height="170"></canvas></div>
        <div class="breed-fig" id="breed-fig-r"><canvas width="130" height="170"></canvas></div>
        <div id="breed-cloud"></div>
        <div id="breed-bolt">⚡</div>
        <div id="breed-text"></div>
      </div>
    </div>

    <div id="hera-overlay">
      <div id="hera-vignette"></div>
      <div id="hera-dialog" class="sketch">
        <h2>赫拉降临了！ <span class="close-x" id="hera-close" style="display:none">×</span></h2>
        <div class="hera-quote" id="hera-quote"></div>
        <div id="hera-choices"></div>
      </div>
    </div>

    <div id="win-overlay">
      <div id="win-inner" class="sketch">
        <h1>⚡ 登 神 ⚡</h1>
        <div>宙斯加冕为<b>众神之父</b>，奥林匹斯雷声经久不息。</div>
        <div id="win-stats"></div>
        <div><button class="sketch-btn gold" id="win-continue">继续游玩（众神之父也要过日子）</button></div>
      </div>
    </div>

    <div id="menu">
      <div id="menu-inner" class="sketch">
        <h1>宙斯成神之路</h1>
        <div class="en">ZEUS : PATH TO GODHOOD</div>
        <div class="desc">从 100 点神力起步，游走五片大陆，与凡人、精灵、美人鱼乃至神话生物结缘。<br>
        子嗣越多，神力越盛——但赫拉的目光，也从未离开。<br>
        攒满 <b>10000 神力</b>，登神成为众神之父。</div>
        <div class="btns">
          <button class="sketch-btn gold" id="btn-new">开始成神之路</button>
          <button class="sketch-btn" id="btn-continue" style="display:none">继续上次的游戏</button>
        </div>
        <canvas id="menu-canvas" width="420" height="130"></canvas>
        <div class="footer">手绘线条风 · 网页开源游戏 · 所有演出均为含蓄的卡通表现，赫拉本人监督认证</div>
      </div>
    </div>

    <div id="selftest" class="sketch"><pre id="selftest-pre"></pre></div>
  </div>
</div>

<script src="js/audio.js"></script>
<script src="js/draw.js"></script>
<script src="js/world.js"></script>
<script src="js/entities.js"></script>
<script src="js/systems.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script src="js/stats.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
